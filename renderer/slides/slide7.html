<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..900;1,9..40,100..900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1350px;background:#111;display:flex;align-items:center;justify-content:center}
.slide{width:1080px;height:1350px;display:flex;flex-direction:column;overflow:hidden;font-family:'DM Sans',sans-serif;background:#111;position:relative}

.s7-bg1{position:absolute;top:-160px;right:-160px;width:640px;height:640px;border-radius:50%;background:rgba(255,255,255,0.03)}
.s7-bg2{position:absolute;bottom:-240px;left:-160px;width:720px;height:720px;border-radius:50%;background:rgba(255,255,255,0.02)}
.s7-content{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:96px;text-align:center}

.s7-name{font-size:52px;font-weight:800;color:#fff;letter-spacing:.16em;margin-bottom:32px}
.s7-statement{font-size:36px;font-weight:600;color:#555;letter-spacing:.04em;margin-bottom:112px;line-height:1.6}
.s7-divider{width:96px;height:2px;background:#333;margin:0 auto 64px}
.s7-handle{font-size:35px;font-weight:600;color:#444;letter-spacing:.1em;font-style:italic}
</style>
</head>
<body>
<div class="slide">
  <div class="s7-bg1"></div>
  <div class="s7-bg2"></div>
  <div class="s7-content">
    <svg width="160px" height="160px" viewBox="190 30 300 300" xmlns="http://www.w3.org/2000/svg" style="margin-bottom:48px">
      <rect x="190" y="30" width="300" height="300" rx="56" fill="#ffffff"/>
      <circle cx="328" cy="168" r="86" fill="#f0f0f0"/>
      <circle cx="328" cy="168" r="86" fill="none" stroke="#111" stroke-width="20"/>
      <line x1="392" y1="232" x2="448" y2="288" fill="none" stroke="#111" stroke-width="20" stroke-linecap="round"/>
      <polyline points="296,168 318,192 362,144" fill="none" stroke="#22C55E" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="s7-name">FACTCHECKLY</div>
    <div class="s7-statement">AI-powered news credibility analysis</div>
    <div class="s7-divider"></div>
    <div class="s7-handle">@THEFACTCHECKLY</div>
  </div>
</div>
</body>
</html>
