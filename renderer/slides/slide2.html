<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..900;1,9..40,100..900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1350px;background:#111;display:flex;align-items:center;justify-content:center}
.slide{width:1080px;height:1350px;display:flex;flex-direction:column;border:3px solid #2a2a2a;overflow:hidden;font-family:'DM Sans',sans-serif;background:#111;position:relative}
.slide-inner{position:relative;z-index:1;flex:1;display:flex;flex-direction:column}

.top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:auto;padding:64px 64px 0;}
.slide-label{font-size:32px;font-weight:700;color:#fff;letter-spacing:.1em;background:#222;padding:12px 28px;border-radius:8px;}
.brand-row{display:flex;align-items:center;gap:16px;background:#222;padding:12px 24px 12px 16px;border-radius:8px;}
.brand-name-b{font-size:32px;font-weight:700;color:#fff;letter-spacing:.1em}

.s2-gauge{display:flex;flex-direction:column;align-items:center;flex:1;justify-content:center;padding:32px}
.s2-score-wrap{position:relative;width:460px;height:460px}
.s2-score-wrap svg{width:100%;height:100%}
.s2-score-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;align-items:baseline;gap:8px}
.s2-num{font-size:240px;font-weight:800;color:#fff;line-height:1}
.s2-denom{font-size:60px;font-weight:600;color:#555}
.s2-pill{margin-top:48px;display:inline-flex;align-items:center;gap:20px;padding:24px 56px;border-radius:80px;background:#1a1a1a;border:solid 2px {{verdictColor}};}
.s2-pill-dot{width:20px;height:20px;border-radius:50%;background:{{verdictColor}}}
.s2-pill-text{text-transform:uppercase;font-size:36px;font-weight:800;color:{{verdictColor}};letter-spacing:.04em}

.s2-bottom{margin-top:auto;padding:0 64px 64px;}
.s2-divider{height:2px;background:#2a2a2a;margin-bottom:32px}
.s2-summary{font-size:38px;font-weight:600;color:#fff;line-height:1.6}
</style>
</head>
<body>
<div class="slide">
  <div class="slide-inner">
    <div class="top-row">
      <div class="slide-label">CREDIBILITY SCORE</div>
      <div class="brand-row">
        <svg width="80px" height="80px" viewBox="190 30 300 300" xmlns="http://www.w3.org/2000/svg">
          <rect x="190" y="30" width="300" height="300" rx="56" fill="#fff"/>
          <circle cx="328" cy="168" r="86" fill="#f0f0f0"/>
          <circle cx="328" cy="168" r="86" fill="none" stroke="#111" stroke-width="20"/>
          <line x1="392" y1="232" x2="448" y2="288" fill="none" stroke="#111" stroke-width="20" stroke-linecap="round"/>
          <polyline points="296,168 318,192 362,144" fill="none" stroke="rgb(74,222,128)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand-name-b">FACTCHECKLY</span>
      </div>
    </div>
    <div class="s2-gauge">
      <div class="s2-score-wrap">
        <svg viewBox="0 0 560 560" xmlns="http://www.w3.org/2000/svg">
          <circle cx="280" cy="280" r="232" fill="none" stroke="#2a2a2a" stroke-width="40"/>
          <circle cx="280" cy="280" r="232" fill="none" stroke="{{verdictColor}}" stroke-width="40"
            stroke-dasharray="{{scoreDasharray}} 9999"
            stroke-linecap="round"
            transform="rotate(-90 280 280)"/>
        </svg>
        <div class="s2-score-text">
          <span class="s2-num">{{score}}</span>
          <span class="s2-denom">/10</span>
        </div>
      </div>
      <div class="s2-pill">
        <div class="s2-pill-dot"></div>
        <span class="s2-pill-text">{{verdict}}</span>
      </div>
    </div>
    <div class="s2-bottom">
      <div class="s2-divider"></div>
      <div class="s2-summary">{{summary}}</div>
    </div>
  </div>
</div>
</body>
</html>
