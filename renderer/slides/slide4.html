<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..900;1,9..40,100..900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1350px;background:#111;display:flex;align-items:center;justify-content:center}
.slide{width:1080px;height:1350px;display:flex;flex-direction:column;border:3px solid #2a2a2a;overflow:hidden;font-family:'DM Sans',sans-serif;background:#111;padding:64px}

.top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:64px}
.slide-label{font-size:32px;font-weight:700;color:#fff;letter-spacing:.1em;background:#222;padding:12px 28px;border-radius:8px}
.brand-row{display:flex;align-items:center;gap:16px;background:#222;padding:12px 24px 12px 16px;border-radius:8px}
.brand-name-b{font-size:32px;font-weight:700;color:#fff;letter-spacing:.1em}

.s4-flags{flex:1;display:flex;flex-direction:column}
.s4-flag{display:flex;gap:40px;align-items:flex-start;padding:48px 0;border-bottom:2px solid #2a2a2a}
.s4-flag:last-child{border-bottom:none}
.s4-num{font-size:36px;font-weight:700;color:#FC8181;min-width:56px;padding-top:6px}
.s4-title{font-size:44px;font-weight:700;color:#fff;margin-bottom:12px}
.s4-desc{font-size:36px;font-weight:600;color:#bbb;line-height:1.5}

.s4-footer{margin-top:auto;padding-top:40px;border-top:2px solid #2a2a2a;display:flex;align-items:center;gap:20px}
.s4-footer-dot{width:16px;height:16px;border-radius:50%;background:#FC8181}
.s4-footer-text{font-size:36px;font-weight:700;color:#FC8181;letter-spacing:.04em}
</style>
</head>
<body>
<div class="slide">
  <div class="top-row">
    <div class="slide-label">RED FLAGS</div>
    <div class="brand-row">
      <svg width="80px" height="80px" viewBox="190 30 300 300" xmlns="http://www.w3.org/2000/svg">
        <rect x="190" y="30" width="300" height="300" rx="56" fill="#fff"/>
        <circle cx="328" cy="168" r="86" fill="#f0f0f0"/>
        <circle cx="328" cy="168" r="86" fill="none" stroke="#111" stroke-width="20"/>
        <line x1="392" y1="232" x2="448" y2="288" fill="none" stroke="#111" stroke-width="20" stroke-linecap="round"/>
        <polyline points="296,168 318,192 362,144" fill="none" stroke="rgb(74,222,128)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-name-b">FACTCHECKLY</span>
    </div>
  </div>
  <div class="s4-flags">
    {{flagsHtml}}
  </div>
  <div class="s4-footer">
    <div class="s4-footer-dot"></div>
    <span class="s4-footer-text">{{flagCount}} RED FLAG{{flagPlural}} DETECTED</span>
  </div>
</div>
</body>
</html>
